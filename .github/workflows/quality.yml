name: Quality

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npx tsc -p tsconfig.json --pretty false

      - name: Test VPS deployment script
        run: bash tests/deployVpsScript.test.sh

      - name: Validate docker compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build production Docker image
        run: docker build --tag vacancies-searcher:ci .
