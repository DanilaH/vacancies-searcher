name: vacancies-searcher

services:
  vacancy-bot:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
